<svg width="192" height="192" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="55%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#3b0f80" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 라운드 사각 배경 (보라 그라데이션) -->
  <rect x="0" y="0" width="192" height="192" rx="224" fill="url(#bg)"/>

  <!-- 은은한 장식 링 -->
  <circle cx="512" cy="452" r="352" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.10"/>
  <circle cx="512" cy="452" r="270" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.07"/>

  <!-- T 심볼 -->
  <text x="512" y="612"
    font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
    font-size="560"
    font-weight="900"
    fill="url(#tg)"
    text-anchor="middle"
    filter="url(#ds)"
    letter-spacing="-10">T</text>

  <!-- 하단 브랜드명: 퍼블리 트래픽 -->
  <rect x="212" y="742" width="600" height="132" rx="66" fill="#ffffff" opacity="0.14"/>
  <text x="512" y="832"
    font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"
    font-size="82"
    font-weight="800"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="2">퍼블리 트래픽</text>
</svg>
